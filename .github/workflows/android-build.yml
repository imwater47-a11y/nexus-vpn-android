
name: NEXUS VPN Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p appsrc
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d appsrc

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p appsrc assembleDebug testDebugUnitTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-VPN-Debug-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
